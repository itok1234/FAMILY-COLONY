// FAMILY COLONY 5.0 signed production APK configuration.
plugins {
    id 'com.android.application'
}

android {
    namespace 'com.cdl.familycolonyv5d'
    compileSdk 35

    defaultConfig {
        // Godot's native Android engine is packaged for the common 64-bit and 32-bit ARM devices.
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
        aaptOptions {
            ignoreAssetsPattern '!.svn:!.git:!.gitignore:!.ds_store:!*.scc:<dir>_*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
        applicationId 'com.cdl.familycolonyv5d'
        minSdk 23
        targetSdk 35
        versionCode 12
        versionName '5.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    signingConfigs {
        release {
            def ksPath = System.getenv("FC_KEYSTORE_PATH")
            def ksPassword = System.getenv("FC_KEYSTORE_PASSWORD")
            def keyAliasValue = System.getenv("FC_KEY_ALIAS")
            def keyPasswordValue = System.getenv("FC_KEY_PASSWORD")
            if (ksPath && ksPassword && keyAliasValue && keyPasswordValue) {
                storeFile file(ksPath)
                storePassword ksPassword
                keyAlias keyAliasValue
                keyPassword keyPasswordValue
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.onlinetest13' // Unique package id to avoid signature/package conflicts
            versionNameSuffix '-world-maintenance-test-13'
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
