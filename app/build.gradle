// FAMILY COLONY 5.0 signed production APK configuration.
plugins {
    id 'com.android.application'
}

android {
    namespace 'com.cdl.familycolonyv5d'
    compileSdk 35

    defaultConfig {
        // A test build for the target Redmi Note 8 Pro packages ARM64 only.
        // Other builds retain the project's normal ARM ABI support.
        if (!project.hasProperty('fcSplitReleaseApks')) {
            ndk {
                if (project.hasProperty('fcTestArm64Only')) {
                    abiFilters 'arm64-v8a'
                } else {
                    abiFilters 'arm64-v8a', 'armeabi-v7a'
                }
            }
        }
        aaptOptions {
            ignoreAssetsPattern '!.svn:!.git:!.gitignore:!.ds_store:!*.scc:<dir>_*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
        applicationId 'com.cdl.familycolonyv5d'
        minSdk 23
        targetSdk 35
        versionCode 12
        versionName '5.0'
    }

    // Publish separate APKs so each phone downloads only its own native Godot engine.
    splits {
        abi {
            enable project.hasProperty('fcSplitReleaseApks')
            reset()
            include 'arm64-v8a', 'armeabi-v7a'
            universalApk false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    signingConfigs {
        release {
            def ksPath = System.getenv("FC_KEYSTORE_PATH")
            def ksPassword = System.getenv("FC_KEYSTORE_PASSWORD")
            def keyAliasValue = System.getenv("FC_KEY_ALIAS")
            def keyPasswordValue = System.getenv("FC_KEY_PASSWORD")
            if (ksPath && ksPassword && keyAliasValue && keyPasswordValue) {
                storeFile file(ksPath)
                storePassword ksPassword
                keyAlias keyAliasValue
                keyPassword keyPasswordValue
            }
        }
    }

    buildTypes {
        debug {
            // Keep test package separate from the production app and previous test build.
            applicationIdSuffix '.onlinetest14'
            versionNameSuffix '-world-maintenance-test-14'
        }
        release {
            if (!project.hasProperty('fcSplitReleaseApks')) {
                ndk {
                    abiFilters 'arm64-v8a', 'armeabi-v7a'
                }
            }
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'org.godotengine:godot:4.4.1.stable'
    implementation 'androidx.fragment:fragment:1.8.6'
}


// Package the Godot project as a main pack inside the existing Android application.
tasks.register("packageGodotWorld", Zip) {
    archiveFileName = "godot_world.zip"
    destinationDirectory = layout.projectDirectory.dir("src/main/assets")
    from("../godot_world") {
        exclude ".godot/**", ".git/**", "docs/**"
    }
    includeEmptyDirs = false
}

tasks.named("preBuild").configure {
    dependsOn("packageGodotWorld")
}
