plugins {
    id 'com.android.application'
}

android {
    namespace 'com.cdl.familycolonyv5d'
    compileSdk 35

    defaultConfig {
        applicationId 'com.cdl.familycolonyv5d'
        minSdk 23
        targetSdk 35
        versionCode 7
        versionName '4.3-portrait-private-dev'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        debug {
            applicationIdSuffix '.onlinetest11' // Install alongside earlier test builds without uninstalling
            versionNameSuffix '-portrait-test-11'
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}
