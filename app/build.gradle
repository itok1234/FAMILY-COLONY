plugins {
    id 'com.android.application'
}

android {
    namespace 'com.cdl.familycolonyv5d'
    compileSdk 35

    defaultConfig {
        applicationId 'com.cdl.familycolonyv5d'
        minSdk 23
        targetSdk 35
        versionCode 5
        versionName '4.1-online-auth'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        debug {
            applicationIdSuffix '.onlinetest8' // Install alongside earlier test builds without uninstalling
            versionNameSuffix '-online-test-8'
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}
