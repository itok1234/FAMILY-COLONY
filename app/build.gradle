plugins {
    id 'com.android.application'
}

android {
    namespace 'com.cdl.familycolonyv5d'
    compileSdk 35

    defaultConfig {
        applicationId 'com.cdl.familycolonyv5d'
        minSdk 23
        targetSdk 35
        versionCode 6
        versionName '4.2-developer-pin'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        debug {
            applicationIdSuffix '.onlinetest10' // Install alongside earlier test builds without uninstalling
            versionNameSuffix '-developer-pin-test-10'
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}
