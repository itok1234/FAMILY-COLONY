name: Build FAMILY COLONY ARM64 Test APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  arm64-test-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tested Android source
        uses: actions/checkout@v4
        with:
          ref: feature/guest-premium-access

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build ARM64-only debug APK
        run: gradle --no-daemon assembleDebug -PfcTestArm64Only --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          APKSIGNER="$(find "$SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          AAPT="$(find "$SDK_ROOT/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          "$APKSIGNER" verify --verbose "$APK"
          "$AAPT" dump badging "$APK" | grep -E "^package:|^sdkVersion:|^targetSdkVersion:"
          sha256sum "$APK"
          stat -c "APK_SIZE_BYTES=%s" "$APK"

      - name: Upload ARM64 test APK
        uses: actions/upload-artifact@v4
        with:
          name: FAMILY-COLONY-ARM64-TEST-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
