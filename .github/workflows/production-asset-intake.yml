name: FAMILY COLONY Production Asset Intake
on:
  workflow_dispatch:
  push:
    branches: [feature/direct-3d-entry]
    paths:
      - ".github/workflows/production-asset-intake.yml"
permissions:
  contents: read
jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve itch upload ID and fetch signed CDN URL
        shell: bash
        run: |
          set -u
          mkdir -p packs evidence
          failed=0
          for slug in free-stylized-animated free-stylized-fantasy free-stylized-nature; do
            base="https://soresa-assets.itch.io/$slug"
            echo "=== $slug ==="
            curl -L --fail -sS -A "Mozilla/5.0" -c "evidence/$slug.cookies" "$base" -o "evidence/$slug.html" || { failed=1; continue; }
            token=$(python - "$slug" <<'PY'
          import re,sys
          s=open('evidence/'+sys.argv[1]+'.html',encoding='utf8').read()
          m=re.search(r'name="csrf_token" value="([^"]+)"',s)
          print(m.group(1) if m else '')
          PY
            )
            upload=$(python - "$slug" <<'PY'
          import re,sys
          s=open('evidence/'+sys.argv[1]+'.html',encoding='utf8').read()
          m=re.search(r'data-upload_id="(\d+)"[^>]*class="button download_btn"|class="button download_btn"[^>]*data-upload_id="(\d+)"',s)
          print((m.group(1) or m.group(2)) if m else '')
          PY
            )
            if [ -z "$token" ] || [ -z "$upload" ]; then echo "CSRF or upload ID missing"; failed=1; continue; fi
            dlpage=$(curl -L --fail -sS -c "evidence/$slug.cookies" -b "evidence/$slug.cookies" -A "Mozilla/5.0" -H "Referer: $base" --data-urlencode "csrf_token=$token" --data-urlencode "price=0" "$base/download_url" -o "evidence/$slug-download-page.html" -w '%{url_effective}' || true)
            echo "Download page obtained"
            # Download button on itch's download page uses POST /file/<upload_id>.
            dtoken=$(python - "$slug" <<'PY'
          import re,sys
          s=open('evidence/'+sys.argv[1]+'-download-page.html',encoding='utf8').read()
          m=re.search(r'name="csrf_token" value="([^"]+)"',s)
          print(m.group(1) if m else '')
          PY
            )
            if [ -z "$dtoken" ]; then echo "Download-page CSRF missing"; failed=1; continue; fi
            fileurl="$base/file/$upload"
            code=$(curl -L -sS -c "evidence/$slug.cookies" -b "evidence/$slug.cookies" -A "Mozilla/5.0" -H "Referer: $dlpage" -H "Content-Type: application/x-www-form-urlencoded" --data-urlencode "csrf_token=$dtoken" "$fileurl" -o "evidence/$slug-file-response.html" -w '%{http_code}' || true)
            echo "File endpoint HTTP: $code"
            # If POST response is HTML, parse any redirect URL or retry redirect-aware curl as saved response.
            finalurl=$(python - "$slug" <<'PY'
          import re,sys
          s=open('evidence/'+sys.argv[1]+'-file-response.html',encoding='utf8').read()
          for pat in [r'(https?://[^"\s<>]+)',r'location.href\s*=\s*["\']([^"\']+)']:
            m=re.search(pat,s)
            if m:
              print(m.group(1));break
          PY
            )
            if [ -n "$finalurl" ] && [[ "$finalurl" == http* ]]; then
              curl -L --fail -sS -A "Mozilla/5.0" -b "evidence/$slug.cookies" "$finalurl" -o "packs/$slug.zip" || true
            else
              echo "No redirect URL found in endpoint response" > "evidence/$slug-diagnosis.txt"
            fi
            file "packs/$slug.zip" 2>/dev/null || true
            if unzip -t "packs/$slug.zip" > "evidence/$slug-zip-test.txt" 2>&1; then
              mkdir -p "packs/$slug"
              unzip -q "packs/$slug.zip" -d "packs/$slug"
              echo "ARCHIVE PASS: $slug"
            else
              cat "evidence/$slug-zip-test.txt" 2>/dev/null || true
              failed=1
            fi
          done
          exit "$failed"
      - name: Inventory models
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          root=Path('packs'); report=[]
          for folder in root.iterdir():
            if folder.is_dir() and folder.name.startswith('free-stylized'):
              files=[str(p.relative_to(root)) for p in folder.rglob('*') if p.is_file()]
              models=[p for p in files if p.lower().endswith(('.glb','.gltf','.fbx','.obj','.blend','.dae'))]
              report.append({'pack':folder.name,'files':len(files),'models':models})
          Path('packs/inventory.json').write_text(json.dumps(report,indent=2))
          print(json.dumps(report,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: family-colony-production-packs-diagnostic
          path: packs/
          retention-days: 7
