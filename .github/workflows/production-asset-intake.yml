name: FAMILY COLONY Production Asset Intake
on:
  workflow_dispatch:
  push:
    branches: [feature/direct-3d-entry]
    paths:
      - ".github/workflows/production-asset-intake.yml"
permissions:
  contents: read
jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Download through itch two-step file flow
        shell: bash
        run: |
          set -u
          mkdir -p packs evidence
          failed=0
          for slug in free-stylized-animated free-stylized-fantasy free-stylized-nature; do
            base="https://soresa-assets.itch.io/$slug"
            echo "=== $slug ==="
            curl -L --fail -sS -A "Mozilla/5.0" -c "evidence/$slug.cookies" "$base" -o "evidence/$slug.html" || { failed=1; continue; }
            token=$(python - "$slug" <<'PY'
          import re,sys
          s=open('evidence/'+sys.argv[1]+'.html',encoding='utf8').read()
          m=re.search(r'name="csrf_token" value="([^"]+)"',s)
          print(m.group(1) if m else '')
          PY
            )
            if [ -z "$token" ]; then echo "Page CSRF missing"; failed=1; continue; fi
            response=$(curl -L --fail -sS -c "evidence/$slug.cookies" -b "evidence/$slug.cookies" -A "Mozilla/5.0" -H "Referer: $base" -H "Content-Type: application/x-www-form-urlencoded" --data-urlencode "csrf_token=$token" --data-urlencode "price=0" "$base/download_url")
            dlurl=$(python -c 'import json,sys; print(json.loads(sys.argv[1]).get("url",""))' "$response")
            if [ -z "$dlurl" ]; then echo "Download page URL missing"; failed=1; continue; fi
            curl -L --fail -sS -A "Mozilla/5.0" -c "evidence/$slug.cookies" -b "evidence/$slug.cookies" "$dlurl" -o "evidence/$slug-download-page.html" || { failed=1; continue; }
            dtoken=$(python - "$slug" <<'PY'
          import re,sys
          s=open('evidence/'+sys.argv[1]+'-download-page.html',encoding='utf8').read()
          m=re.search(r'name="csrf_token" value="([^"]+)"',s)
          print(m.group(1) if m else '')
          PY
            )
            upload=$(python - "$slug" <<'PY'
          import re,sys
          s=open('evidence/'+sys.argv[1]+'-download-page.html',encoding='utf8').read()
          m=re.search(r'data-upload_id="(\d+)"',s)
          print(m.group(1) if m else '')
          PY
            )
            if [ -z "$dtoken" ] || [ -z "$upload" ]; then echo "Download page token or upload ID missing"; failed=1; continue; fi
            fileurl="https://itch.io/file/$upload"
            curl -L --fail -sS -A "Mozilla/5.0" -c "evidence/$slug.cookies" -b "evidence/$slug.cookies" -H "Referer: $dlurl" -H "Content-Type: application/x-www-form-urlencoded" --data-urlencode "csrf_token=$dtoken" "$fileurl" -o "packs/$slug.zip" || { failed=1; continue; }
            file "packs/$slug.zip"
            if unzip -t "packs/$slug.zip" > "evidence/$slug-zip-test.txt" 2>&1; then
              mkdir -p "packs/$slug"
              unzip -q "packs/$slug.zip" -d "packs/$slug"
              echo "ARCHIVE PASS: $slug"
            else
              cat "evidence/$slug-zip-test.txt"
              failed=1
            fi
          done
          exit "$failed"
      - name: Inventory models
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          root=Path('packs'); report=[]
          for folder in root.iterdir():
            if folder.is_dir() and folder.name.startswith('free-stylized'):
              files=[str(p.relative_to(root)) for p in folder.rglob('*') if p.is_file()]
              models=[p for p in files if p.lower().endswith(('.glb','.gltf','.fbx','.obj','.blend','.dae'))]
              report.append({'pack':folder.name,'files':len(files),'models':models})
          Path('packs/inventory.json').write_text(json.dumps(report,indent=2))
          print(json.dumps(report,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: family-colony-production-packs-diagnostic
          path: |
            packs/
            evidence/
          retention-days: 7
