name: FAMILY COLONY Production Asset Intake
on:
  workflow_dispatch:
  push:
    branches: [feature/direct-3d-entry]
    paths:
      - ".github/workflows/production-asset-intake.yml"
permissions:
  contents: read
jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Download verified CC0 GLB assets from live manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p packs/characters packs/environment evidence
          python - <<'PY'
          import json, urllib.request, pathlib, re, sys
          root=pathlib.Path('packs')
          req=urllib.request.Request('https://gobkit.com/api/free',headers={'User-Agent':'FamilyColonyAssetIntake/1.0'})
          with urllib.request.urlopen(req,timeout=60) as r: data=json.load(r)
          packs=data.get('packs',[])
          selected=[]
          for p in packs:
            pid=p.get('id','').lower()
            name=p.get('name','').lower()
            kind=p.get('kind','').lower()
            if ('minion' in pid or 'minion' in name) and kind=='characters':
              selected.extend((m,'characters') for m in p.get('models',[]))
            if ('nature-kit' in pid or name=='nature kit') and kind=='environment':
              selected.extend((m,'environment') for m in p.get('models',[]))
          # Include the Bee mascot model from its animal pack.
          for p in packs:
            if 'animalb' in p.get('id','').lower():
              selected.extend((m,'characters') for m in p.get('models',[]) if m.get('id','').lower()=='bee')
          if not selected: raise SystemExit('Manifest selection empty; fail safely.')
          report=[]
          for m,category in selected:
            url=m.get('url','')
            if not url.startswith('https://') or not url.endswith('.glb'): continue
            name=re.sub(r'[^A-Za-z0-9_.-]','_',m.get('id') or m.get('name') or pathlib.Path(url).stem)
            dest=root/category/(name+'.glb')
            req=urllib.request.Request(url,headers={'User-Agent':'FamilyColonyAssetIntake/1.0'})
            with urllib.request.urlopen(req,timeout=90) as r: blob=r.read()
            if len(blob)<100 or blob[:4]!=b'glTF':
              raise SystemExit(f'Invalid GLB payload: {name} ({len(blob)} bytes)')
            dest.write_bytes(blob)
            report.append({'name':name,'category':category,'url':url,'bytes':len(blob),'rigged':m.get('rigged',False),'animations':m.get('animations',[]),'license':m.get('license','CC0 listed in pack manifest')})
            print(f'PASS {name} {len(blob)} bytes')
          pathlib.Path('evidence/asset_manifest_audit.json').write_text(json.dumps(report,indent=2))
          print(f'DOWNLOAD PASS: {len(report)} validated GLB files')
          PY
      - name: Summarize candidates
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          root=Path('packs')
          rows=[]
          for category in ('characters','environment'):
            files=list((root/category).glob('*.glb'))
            rows.append({'category':category,'count':len(files),'files':[{'name':f.name,'bytes':f.stat().st_size} for f in files]})
          Path('evidence/inventory.json').write_text(json.dumps(rows,indent=2))
          print(json.dumps(rows,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: family-colony-production-glb-candidates
          path: |
            packs/
            evidence/
          retention-days: 7
