name: FAMILY COLONY Production Asset Intake
on:
  workflow_dispatch:
  push:
    branches: [feature/direct-3d-entry]
    paths:
      - ".github/workflows/production-asset-intake.yml"
permissions:
  contents: read
jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Obtain and fetch sampler archives with persistent session
        shell: bash
        run: |
          set -u
          mkdir -p packs evidence
          failed=0
          for slug in free-stylized-animated free-stylized-fantasy free-stylized-nature; do
            base="https://soresa-assets.itch.io/$slug"
            echo "=== $slug ==="
            curl -L --fail -sS -A "Mozilla/5.0" -c "evidence/$slug.cookies" "$base" -o "evidence/$slug.html" || { echo "Page fetch failed"; failed=1; continue; }
            token=$(python - "$slug" <<'PY'
          import re,sys
          s=open('evidence/'+sys.argv[1]+'.html',encoding='utf8').read()
          m=re.search(r'name="csrf_token" value="([^"]+)"',s)
          print(m.group(1) if m else '')
          PY
            )
            if [ -z "$token" ]; then echo "CSRF token missing"; failed=1; continue; fi
            response=$(curl -L -sS -c "evidence/$slug.cookies" -b "evidence/$slug.cookies" -A "Mozilla/5.0" -H "Referer: $base" -H "Content-Type: application/x-www-form-urlencoded" --data-urlencode "csrf_token=$token" --data-urlencode "price=0" "$base/download_url" -o "evidence/$slug-url-response.json" -w '%{http_code}' || true)
            echo "URL request HTTP: $response"
            url=$(python - "$slug" <<'PY'
          import json,sys
          try:
            d=json.loads(open('evidence/'+sys.argv[1]+'-url-response.json').read())
            print(d.get('url',''))
          except Exception as e: print('')
          PY
            )
            if [ -z "$url" ]; then echo "URL response invalid; saved evidence"; failed=1; continue; fi
            http=$(curl -L -sS -A "Mozilla/5.0" -b "evidence/$slug.cookies" "$url" -o "packs/$slug.zip" -w '%{http_code}' || true)
            echo "Archive response HTTP: $http"
            file "packs/$slug.zip" || true
            head -c 300 "packs/$slug.zip" > "evidence/$slug-download-preview.txt" || true
            if unzip -t "packs/$slug.zip" > "evidence/$slug-zip-test.txt" 2>&1; then
              mkdir -p "packs/$slug"
              unzip -q "packs/$slug.zip" -d "packs/$slug"
              echo "ARCHIVE PASS: $slug"
            else
              cat "evidence/$slug-zip-test.txt"
              failed=1
            fi
          done
          exit "$failed"
      - name: Inventory models
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          root=Path('packs'); report=[]
          for folder in root.iterdir():
            if folder.is_dir() and folder.name.startswith('free-stylized'):
              files=[str(p.relative_to(root)) for p in folder.rglob('*') if p.is_file()]
              models=[p for p in files if p.lower().endswith(('.glb','.gltf','.fbx','.obj','.blend','.dae'))]
              report.append({'pack':folder.name,'files':len(files),'models':models})
          Path('packs/inventory.json').write_text(json.dumps(report,indent=2))
          print(json.dumps(report,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: family-colony-production-packs-diagnostic
          path: |
            packs/
            evidence/
          retention-days: 7
