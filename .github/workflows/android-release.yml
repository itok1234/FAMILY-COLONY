name: Publish FAMILY COLONY Android APK

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag (for example v5.0.0)"
        required: true
        type: string
      prerelease:
        description: "Mark this release as a prerelease"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  release-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Validate release signing secrets
        shell: bash
        env:
          FC_KEYSTORE_BASE64: ${{ secrets.FC_KEYSTORE_BASE64 }}
          FC_KEYSTORE_PASSWORD: ${{ secrets.FC_KEYSTORE_PASSWORD }}
          FC_KEY_ALIAS: ${{ secrets.FC_KEY_ALIAS }}
          FC_KEY_PASSWORD: ${{ secrets.FC_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in FC_KEYSTORE_BASE64 FC_KEYSTORE_PASSWORD FC_KEY_ALIAS FC_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::GitHub Actions secret $name belum diatur."
              exit 1
            fi
          done
          printf '%s' "$FC_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/family-colony-release.jks"
          test -s "$RUNNER_TEMP/family-colony-release.jks"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build signed Release APK
        env:
          FC_KEYSTORE_PATH: ${{ runner.temp }}/family-colony-release.jks
          FC_KEYSTORE_PASSWORD: ${{ secrets.FC_KEYSTORE_PASSWORD }}
          FC_KEY_ALIAS: ${{ secrets.FC_KEY_ALIAS }}
          FC_KEY_PASSWORD: ${{ secrets.FC_KEY_PASSWORD }}
        run: gradle --no-daemon assembleRelease --stacktrace

      - name: Verify signed APK
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          APKSIGNER="$(find "$SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          AAPT="$(find "$SDK_ROOT/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          "$APKSIGNER" verify --verbose "$APK"
          "$AAPT" dump badging "$APK" | grep -E "^package:|^sdkVersion:|^targetSdkVersion:"
          sha256sum "$APK"

      - name: Upload signed Release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FAMILY-COLONY-RELEASE-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish direct-download GitHub Release
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          PRERELEASE: ${{ inputs.prerelease }}
        with:
          script: |
            const fs = require('fs');
            const path = 'app/build/outputs/apk/release/app-release.apk';
            const tag = process.env.RELEASE_TAG.trim();
            if (!/^v[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$/.test(tag)) {
              throw new Error('Release tag format is invalid.');
            }
            const prerelease = process.env.PRERELEASE === 'true';
            const release = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              target_commitish: context.sha,
              name: 'FAMILY COLONY — ' + tag + ' Android APK',
              body: [
                'FAMILY COLONY Android package for direct installation.',
                '',
                '- Package: com.cdl.familycolonyv5d',
                '- Distribution: direct APK download; Google Play Store is not required.',
                '- Status: ' + (prerelease ? 'prerelease / testing' : 'final release'),
                '- Install only on Android devices; enable permission to install unknown apps when prompted.'
              ].join('\n'),
              draft: false,
              prerelease,
              make_latest: prerelease ? 'false' : 'true'
            });
            const data = fs.readFileSync(path);
            await github.rest.repos.uploadReleaseAsset({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: release.data.id,
              name: 'FAMILY-COLONY-' + tag + '.apk',
              data,
              headers: {
                'content-type': 'application/vnd.android.package-archive',
                'content-length': data.length
              }
            });
            core.info('Published APK: ' + release.data.html_url);
