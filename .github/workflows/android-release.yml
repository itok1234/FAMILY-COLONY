name: Publish FAMILY COLONY Android APK

on:
  push:
    branches:
      - feature/direct-3d-entry
    paths:
      - 'app/**'
      - 'godot_world/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/android-release.yml'
      - '.github/workflows/android-debug.yml'
      - '.github/workflows/godot-validation.yml'
      - '.github/workflows/android-emulator-smoke.yml'
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag (for example v5.0.0)"
        required: true
        type: string
      prerelease:
        description: "Mark this release as a prerelease"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  release-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Wait for Android build and Godot validation for this commit
        uses: actions/github-script@v7
        with:
          script: |
            const required = [
              { workflow: 'android-debug.yml', label: 'Android APK build and package validation' },
              { workflow: 'godot-validation.yml', label: 'Godot project validation' }
            ];
            const deadline = Date.now() + 12 * 60 * 1000;
            while (Date.now() < deadline) {
              let allPassed = true;
              for (const item of required) {
                const runs = await github.rest.actions.listWorkflowRuns({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  workflow_id: item.workflow,
                  branch: context.ref.replace('refs/heads/', ''),
                  per_page: 30
                });
                const exact = runs.data.workflow_runs.find(run => run.head_sha === context.sha);
                if (!exact) {
                  allPassed = false;
                  core.info(item.label + ' has not started for ' + context.sha + '.');
                  continue;
                }
                if (exact.status !== 'completed') {
                  allPassed = false;
                  core.info(item.label + ' is still running (' + exact.status + ').');
                  continue;
                }
                if (exact.conclusion !== 'success') {
                  throw new Error('APK release blocked: ' + item.label + ' finished with ' + exact.conclusion + ' for ' + context.sha + '.');
                }
                core.info(item.label + ' passed for ' + context.sha + '.');
              }
              if (allPassed) {
                core.info('All required validations passed for the exact release commit.');
                break;
              }
              await new Promise(resolve => setTimeout(resolve, 15000));
            }
            if (Date.now() >= deadline) {
              throw new Error('APK release blocked: required validation workflows did not finish within 12 minutes.');
            }

      - name: Validate release signing secrets
        shell: bash
        env:
          FC_KEYSTORE_BASE64: ${{ secrets.FC_KEYSTORE_BASE64 }}
          FC_KEYSTORE_PASSWORD: ${{ secrets.FC_KEYSTORE_PASSWORD }}
          FC_KEY_ALIAS: ${{ secrets.FC_KEY_ALIAS }}
          FC_KEY_PASSWORD: ${{ secrets.FC_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in FC_KEYSTORE_BASE64 FC_KEYSTORE_PASSWORD FC_KEY_ALIAS FC_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::GitHub Actions secret $name belum diatur."
              exit 1
            fi
          done
          printf '%s' "$FC_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/family-colony-release.jks"
          test -s "$RUNNER_TEMP/family-colony-release.jks"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build signed ARM Release APKs
        env:
          FC_KEYSTORE_PATH: ${{ runner.temp }}/family-colony-release.jks
          FC_KEYSTORE_PASSWORD: ${{ secrets.FC_KEYSTORE_PASSWORD }}
          FC_KEY_ALIAS: ${{ secrets.FC_KEY_ALIAS }}
          FC_KEY_PASSWORD: ${{ secrets.FC_KEY_PASSWORD }}
        run: gradle --no-daemon -PfcSplitReleaseApks assembleRelease --stacktrace

      - name: Verify both signed APK variants
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          APKSIGNER="$(find "$SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          AAPT="$(find "$SDK_ROOT/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          OUT="app/build/outputs/apk/release"
          for ABI in arm64-v8a armeabi-v7a; do
            APK="$OUT/app-$ABI-release.apk"
            test -s "$APK"
            "$APKSIGNER" verify --verbose "$APK"
            "$AAPT" dump badging "$APK" | grep -F "package: name='com.cdl.familycolonyv5d'"
            "$AAPT" dump xmltree "$APK" AndroidManifest.xml | grep -F "com.cdl.familycolonyv5d.WorldActivity"
            unzip -l "$APK" | grep -F "assets/godot_world.zip"
            unzip -p "$APK" "assets/godot_world.zip" > "$RUNNER_TEMP/godot_world-$ABI.zip"
            unzip -l "$RUNNER_TEMP/godot_world-$ABI.zip" | grep -F "project.godot"
            unzip -l "$RUNNER_TEMP/godot_world-$ABI.zip" | grep -F "scenes/world.tscn"
            unzip -l "$RUNNER_TEMP/godot_world-$ABI.zip" | grep -F "scripts/world_session_client.gd"
            sha256sum "$APK"
            APK_BYTES="$(stat -c%s "$APK")"
            APK_MIB="$((APK_BYTES / 1024 / 1024))"
            echo "$ABI signed APK: ${APK_BYTES} bytes (${APK_MIB} MiB)"
            if [ "$APK_BYTES" -gt $((150 * 1024 * 1024)) ]; then
              echo "::warning::$ABI APK exceeds the 150 MiB optimization target."
            fi
          done

      - name: Upload signed Release APK variants
        uses: actions/upload-artifact@v4
        with:
          name: FAMILY-COLONY-RELEASE-APKS
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish direct-download GitHub Release
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ inputs.release_tag || format('v5.0.0-rc.{0}', github.run_number) }}
          PRERELEASE: ${{ inputs.prerelease || github.event_name == 'push' }}
        with:
          script: |
            const fs = require('fs');
            const path = 'app/build/outputs/apk/release/';
            const files = [
              { path: path + 'app-arm64-v8a-release.apk', name: 'FAMILY-COLONY-' + process.env.RELEASE_TAG + '-arm64-v8a.apk' },
              { path: path + 'app-armeabi-v7a-release.apk', name: 'FAMILY-COLONY-' + process.env.RELEASE_TAG + '-armeabi-v7a.apk' }
            ];
            const tag = process.env.RELEASE_TAG.trim();
            if (!/^v[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$/.test(tag)) {
              throw new Error('Release tag format is invalid.');
            }
            const prerelease = process.env.PRERELEASE === 'true';
            const release = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              target_commitish: context.sha,
              name: 'FAMILY COLONY — ' + tag + ' Android APK',
              body: [
                'FAMILY COLONY Android package for direct installation.',
                '',
                '- Package: com.cdl.familycolonyv5d',
                '- arm64-v8a: for most modern Android phones, including Redmi Note 8 Pro.',
                '- armeabi-v7a: for older 32-bit ARM Android phones.',
                '- Distribution: direct APK download; Google Play Store is not required.',
                '- Status: ' + (prerelease ? 'prerelease / testing' : 'final release'),
                '- Install only the APK matching the phone architecture.'
              ].join('\n'),
              draft: false,
              prerelease,
              make_latest: prerelease ? 'false' : 'true'
            });
            for (const file of files) {
              const data = fs.readFileSync(file.path);
              await github.rest.repos.uploadReleaseAsset({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: release.data.id,
                name: file.name,
                data,
                headers: {
                  'content-type': 'application/vnd.android.package-archive',
                  'content-length': data.length
                }
              });
            }
            core.info('Published ABI-specific APKs: ' + release.data.html_url);
