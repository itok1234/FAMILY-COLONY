name: Diagnose Supabase Schema
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect existing Family Colony table columns
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: irwtnqekrwhgompulach
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "SUPABASE_ACCESS_TOKEN is missing"; exit 1; }
          python - <<'PY'
          import json
          from pathlib import Path
          sql = """
          select 'column' as item_type, table_name as item_name,
                 column_name || ' : ' || data_type as details
          from information_schema.columns
          where table_schema='public'
            and table_name in ('fc_members','fc_wallets','fc_wallet_transactions')
          union all
          select 'table_rls', c.relname,
                 'enabled=' || c.relrowsecurity::text || ', forced=' || c.relforcerowsecurity::text
          from pg_class c
          join pg_namespace n on n.oid=c.relnamespace
          where n.nspname='public'
            and c.relname in ('fc_members','fc_wallets','fc_wallet_transactions')
          union all
          select 'policy', tablename || '.' || policyname,
                 cmd || ' / ' || coalesce(qual,'')
          from pg_policies
          where schemaname='public'
            and tablename in ('fc_members','fc_wallets','fc_wallet_transactions')
          order by item_type, item_name
          """
          Path("/tmp/query.json").write_text(json.dumps({"query": sql}))
          PY
          code=$(curl -sS -w "%{http_code}" -o /tmp/result.json -X POST \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/query.json \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query")
          echo "HTTP: $code"
          if [[ "$code" != 2* ]]; then
            python - <<'PY'
          import json
          from pathlib import Path
          try:
            d=json.loads(Path("/tmp/result.json").read_text())
            print("Supabase error:",d.get("message") or d.get("error") or "Request rejected")
          except Exception:
            print("Supabase rejected the request; response omitted.")
          PY
            exit 1
          fi
          echo "Existing table columns:"
          python - <<'PY'
          import json
          from pathlib import Path
          print(json.dumps(json.loads(Path("/tmp/result.json").read_text()), indent=2))
          PY
