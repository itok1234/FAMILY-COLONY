
name: Build FAMILY COLONY V5D Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'FAMILY_COLONY_V5D_SOURCE_UPLOAD.zip'
      - '.github/workflows/android-debug.yml'
      - 'app/**'

permissions:
  contents: write

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="FAMILY_COLONY_V5D_SOURCE_UPLOAD.zip"
          test -f "$ARCHIVE"
          mkdir -p /tmp/family-colony-src
          unzip -q "$ARCHIVE" -d /tmp/family-colony-src
          SRC="/tmp/family-colony-src/FAMILY_COLONY_V5D_Android_Project"
          test -f "$SRC/settings.gradle"
          # The ZIP is a recovery source only. Never overwrite tracked source changes.
          for file in README.md BUILD_STATUS.txt settings.gradle gradle.properties build.gradle; do
            if [ ! -f "$file" ]; then cp -a "$SRC/$file" "$file"; fi
          done
          if [ ! -f app/src/main/assets/index.html ]; then
            cp -a "$SRC/app" .
          else
            echo "Tracked Android source found; preserving repository version."
          fi

      - name: Commit extracted Android source to repository
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md BUILD_STATUS.txt settings.gradle gradle.properties build.gradle app
          if ! git diff --cached --quiet; then
            git commit -m "Extract Android project source for Supabase integration"
            git push
          else
            echo "Android source is already extracted."
          fi

      - name: Upload extracted project for inspection
        uses: actions/upload-artifact@v4
        with:
          name: FAMILY-COLONY-V5D-EXTRACTED-SOURCE
          path: /tmp/family-colony-src/FAMILY_COLONY_V5D_Android_Project/
          if-no-files-found: error

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify project files
        run: |
          test -f settings.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/assets/index.html

      - name: Inject public Supabase client configuration
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: irwtnqekrwhgompulach
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "Missing Supabase access token"; exit 1; }
          curl -fsS -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/api-keys" \
            -o /tmp/fc-api-keys.json
          python - <<'PY'
          import json
          from pathlib import Path
          keys=json.loads(Path("/tmp/fc-api-keys.json").read_text())
          anon=next((x.get("api_key") for x in keys if x.get("name") in ("anon","publishable") and x.get("api_key")),None)
          if not anon:
              raise SystemExit("Public anon/publishable key was not returned by Supabase Management API")
          config={
              "url":"https://irwtnqekrwhgompulach.supabase.co",
              "key":anon
          }
          Path("app/src/main/assets/fc-config.js").write_text(
              "window.FC_SUPABASE_URL="+json.dumps(config["url"])+";window.FC_SUPABASE_ANON_KEY="+json.dumps(config["key"])+";\\n"
          )
          print("Public Supabase client configuration injected; secret service-role key was not used.")
          PY

      - name: Build Debug APK
        run: gradle --no-daemon assembleDebug --stacktrace

      - name: Verify APK
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FAMILY-COLONY-V5D-DEBUG-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
