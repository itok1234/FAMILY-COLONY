name: Validate FAMILY COLONY Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - feature/guest-premium-access
    paths:
      - 'app/**'
      - 'godot_world/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/android-debug.yml'

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify source inputs
        run: |
          test -f settings.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/assets/index.html
          test -f godot_world/project.godot

      - name: Validate bundled WebView JavaScript
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import os
          source = Path("app/src/main/assets/index.html").read_text(encoding="utf-8")
          class ScriptExtractor(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.active = False
                  self.parts = []
                  self.current = []
              def handle_starttag(self, tag, attrs):
                  if tag.lower() == "script":
                      self.active = True
                      self.current = []
              def handle_data(self, data):
                  if self.active:
                      self.current.append(data)
              def handle_endtag(self, tag):
                  if tag.lower() == "script" and self.active:
                      self.parts.append("".join(self.current))
                      self.active = False
          parser = ScriptExtractor()
          parser.feed(source)
          out = Path(os.environ["RUNNER_TEMP"])
          for index, script in enumerate(parser.parts):
              (out / f"fc-inline-{index}.js").write_text(script, encoding="utf-8")
          if not parser.parts:
              raise SystemExit("No inline JavaScript blocks found.")
          print(f"Extracted {len(parser.parts)} inline JavaScript blocks.")
          PY
          for script in "$RUNNER_TEMP"/fc-inline-*.js; do
            node --check "$script"
          done

      - name: Build Debug APK
        run: gradle --no-daemon assembleDebug --stacktrace

      - name: Verify embedded Godot project pack
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          unzip -l "$APK" | grep -F "assets/godot_world.zip"
          unzip -p "$APK" "assets/godot_world.zip" > "$RUNNER_TEMP/godot_world.zip"
          unzip -l "$RUNNER_TEMP/godot_world.zip" | grep -F "project.godot"
          unzip -l "$RUNNER_TEMP/godot_world.zip" | grep -F "scenes/world.tscn"
          unzip -l "$RUNNER_TEMP/godot_world.zip" | grep -F "scripts/world_session_client.gd"

      - name: Verify APK package identity and signature
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          AAPT="$(find "$SDK_ROOT/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          APKSIGNER="$(find "$SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          "$AAPT" dump badging "$APK" | grep -E "^package:|^sdkVersion:|^targetSdkVersion:"
          "$APKSIGNER" verify --verbose "$APK"
          sha256sum "$APK"

      - name: Report internal APK size
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          APK_BYTES="$(stat -c%s "$APK")"
          APK_MIB="$((APK_BYTES / 1024 / 1024))"
          echo "Internal debug APK: ${APK_BYTES} bytes (${APK_MIB} MiB)"
          if [ "$APK_BYTES" -gt $((250 * 1024 * 1024)) ]; then
            echo "::warning::APK exceeds the 250 MiB optimization target; review ABI and asset packaging."
          fi

      - name: Upload internal validation artifact
        uses: actions/upload-artifact@v4
        with:
          name: FAMILY-COLONY-INTERNAL-ANDROID-VALIDATION
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
