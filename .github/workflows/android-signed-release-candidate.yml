name: Build FAMILY COLONY Signed Release Candidate v13
# This workflow intentionally packages the tested feature/direct-3d-entry branch.

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/android-signed-release-candidate.yml"

permissions:
  contents: read

jobs:
  signed-release-candidate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tested Android source
        uses: actions/checkout@v4
        with:
          ref: feature/direct-3d-entry

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Configure private release signing
        shell: bash
        env:
          FC_KEYSTORE_BASE64: ${{ secrets.FC_KEYSTORE_BASE64 }}
          FC_KEYSTORE_PASSWORD: ${{ secrets.FC_KEYSTORE_PASSWORD }}
          FC_KEY_ALIAS: ${{ secrets.FC_KEY_ALIAS }}
          FC_KEY_PASSWORD: ${{ secrets.FC_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$FC_KEYSTORE_BASE64"
          test -n "$FC_KEYSTORE_PASSWORD"
          test -n "$FC_KEY_ALIAS"
          test -n "$FC_KEY_PASSWORD"
          printf '%s' "$FC_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/family-colony-release.jks"
          test -s "$RUNNER_TEMP/family-colony-release.jks"
          echo "FC_KEYSTORE_PATH=$RUNNER_TEMP/family-colony-release.jks" >> "$GITHUB_ENV"
          echo "FC_KEYSTORE_PASSWORD=$FC_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "FC_KEY_ALIAS=$FC_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "FC_KEY_PASSWORD=$FC_KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Build signed split APKs
        run: gradle --no-daemon assembleRelease -PfcSplitReleaseApks --stacktrace

      - name: Verify signed release APKs
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          APKSIGNER="$(find "$SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          AAPT="$(find "$SDK_ROOT/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          mapfile -t APKS < <(find app/build/outputs/apk/release -type f -name '*.apk' | sort)
          test "${#APKS[@]}" -ge 1
          for APK in "${APKS[@]}"; do
            "$APKSIGNER" verify --verbose "$APK"
            "$AAPT" dump badging "$APK" | grep -E "^package:|^sdkVersion:|^targetSdkVersion:"
            unzip -Z1 "$APK" | grep -q '^lib/'
          done
          printf 'Verified release APK count: %s\n' "${#APKS[@]}"

      - name: Upload signed release candidate
        uses: actions/upload-artifact@v4
        with:
          name: FAMILY-COLONY-SIGNED-RELEASE-CANDIDATE
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
