name: FAMILY COLONY Embedded Godot Android Smoke Test

on:
  workflow_dispatch:
  push:
    branches:
      - feature/direct-3d-entry
    paths:
      - "app/build.gradle"
      - "app/src/main/**"
      - ".github/workflows/android-emulator-smoke.yml"
      - "godot_world/**"

permissions:
  contents: read

jobs:
  embedded-godot-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Create temporary CI-only signing key
        run: |
          keytool -genkeypair -noprompt -storetype JKS \
            -keystore "$RUNNER_TEMP/fc-emulator-ci.jks" \
            -storepass "ci-emulator-store-password" \
            -keypass "ci-emulator-key-password" \
            -alias "fc-emulator-validation" \
            -dname "CN=FAMILY COLONY Emulator Validation" \
            -keyalg RSA -keysize 2048 -validity 3650

      - name: Build signed Release APK for Android 11 emulator (x86_64)
        env:
          FC_KEYSTORE_PATH: ${{ runner.temp }}/fc-emulator-ci.jks
          FC_KEYSTORE_PASSWORD: ci-emulator-store-password
          FC_KEY_ALIAS: fc-emulator-validation
          FC_KEY_PASSWORD: ci-emulator-key-password
        run: gradle --no-daemon -PfcEmulatorX86_64 assembleRelease --stacktrace

      - name: Enable KVM access for Android emulator
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
            ls -l /dev/kvm
          else
            echo "::error::KVM device is unavailable on this runner."
            exit 1
          fi

      - name: Launch embedded Godot world in Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_2
          force-avd-creation: true
          disable-animations: true
          disable-linux-hw-accel: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: |
            APK="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n 1)" && test -s "$APK" && adb wait-for-device && adb install "$APK" && adb shell am start -n "com.cdl.familycolonyv5d.next/com.cdl.familycolonyv5d.MainActivity" && sleep 20 && adb shell pidof com.cdl.familycolonyv5d.next && adb shell dumpsys activity activities | grep -F "com.cdl.familycolonyv5d.MainActivity" && adb logcat -d > "$RUNNER_TEMP/family-colony-emulator-logcat.txt" && ! grep -E "FATAL EXCEPTION|SCRIPT ERROR:|Parse Error:|Failed to load main pack|Failed to load scene" "$RUNNER_TEMP/family-colony-emulator-logcat.txt"

      - name: Upload emulator logcat
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FAMILY-COLONY-EMULATOR-LOGCAT
          path: ${{ runner.temp }}/family-colony-emulator-logcat.txt
          if-no-files-found: ignore
          retention-days: 7
