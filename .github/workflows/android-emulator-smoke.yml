name: FAMILY COLONY Embedded Godot Android Smoke Test

on:
  workflow_dispatch:
  push:
    branches:
      - feature/guest-premium-access
    paths:
      - "app/build.gradle"
      - "app/src/main/AndroidManifest.xml"
      - "app/src/main/java/**"
      - "app/src/main/assets/**"
      - "godot_world/**"
      - ".github/workflows/android-emulator-smoke.yml"
      - ".github/workflows/android-release.yml"

permissions:
  contents: read

jobs:
  embedded-godot-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build emulator-compatible internal APK
        run: gradle --no-daemon assembleDebug --stacktrace

      - name: Launch embedded Godot world in Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_2
          force-avd-creation: true
          disable-animations: true
          disable-linux-hardware-acceleration: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: |
            set -euo pipefail
            APK="app/build/outputs/apk/debug/app-debug.apk"
            adb wait-for-device
            for attempt in $(seq 1 30); do
              if [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]; then
                break
              fi
              sleep 2
            done
            test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1"
            adb install "$APK"
            adb shell am start -W -n "com.cdl.familycolonyv5d.onlinetest13/com.cdl.familycolonyv5d.WorldActivity" \
              --es "com.cdl.familycolonyv5d.extra.WORLD_ACCESS_TOKEN" "invalid.world.session.token" \
              --es "com.cdl.familycolonyv5d.extra.WORLD_API_KEY" "invalid-publishable-key"
            sleep 25
            adb shell pidof com.cdl.familycolonyv5d.onlinetest13
            adb shell dumpsys activity activities | grep -F "com.cdl.familycolonyv5d.WorldActivity"
            adb logcat -d > "$RUNNER_TEMP/family-colony-emulator-logcat.txt"
            if grep -E "FATAL EXCEPTION|SCRIPT ERROR:|Parse Error:|Failed to load main pack|Failed to load scene" "$RUNNER_TEMP/family-colony-emulator-logcat.txt"; then
              echo "::error::Embedded Godot world reported a startup failure."
              exit 1
            fi

      - name: Upload emulator logcat
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FAMILY-COLONY-EMULATOR-LOGCAT
          path: \${{ runner.temp }}/family-colony-emulator-logcat.txt
          if-no-files-found: ignore
          retention-days: 7
