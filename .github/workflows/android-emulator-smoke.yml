name: FAMILY COLONY Embedded Godot Android Smoke Test

on:
  workflow_dispatch:
  push:
    branches:
      - feature/direct-3d-entry
      - test/login-3d-full-module
    paths:
      - "app/build.gradle"
      - "app/src/main/**"
      - "app/src/androidTest/**"
      - ".github/workflows/android-emulator-smoke.yml"
      - ".github/workflows/android-release.yml"
      - ".github/workflows/android-debug.yml"
      - ".github/workflows/godot-validation.yml"
      - "godot_world/**"

permissions:
  contents: read

jobs:
  embedded-godot-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Enable KVM access for Android emulator
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
            ls -l /dev/kvm
          else
            echo "::error::KVM device is unavailable on this runner."
            exit 1
          fi

      - name: Launch embedded Godot world in Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_2
          force-avd-creation: true
          disable-animations: true
          disable-linux-hw-accel: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: |
            gradle --no-daemon -PfcEmulatorX86_64 connectedDebugAndroidTest --stacktrace
            adb logcat -d > "$RUNNER_TEMP/family-colony-emulator-logcat.txt"
            grep -F "FC_NATIVE_BRIDGE_METHODS_OK" "$RUNNER_TEMP/family-colony-emulator-logcat.txt"
            grep -F "FC_NATIVE_BRIDGE_CREDENTIALS_OK" "$RUNNER_TEMP/family-colony-emulator-logcat.txt"
            grep -F "FC_WORLD_SESSION_REQUEST_STARTED" "$RUNNER_TEMP/family-colony-emulator-logcat.txt"
            # Live backend status is environment-dependent; require request launch, not a fabricated HTTP 401.
            ! grep -F "FC_WORLD_SESSION_VERIFIED" "$RUNNER_TEMP/family-colony-emulator-logcat.txt"
            ! grep -F "FC_NATIVE_BRIDGE_CREDENTIALS_MISSING" "$RUNNER_TEMP/family-colony-emulator-logcat.txt"
            ! grep -E "FATAL EXCEPTION|SCRIPT ERROR:|Parse Error:|Failed to load main pack|Failed to load scene|Couldn't load project data|Unable to setup the Godot engine" "$RUNNER_TEMP/family-colony-emulator-logcat.txt"

      - name: Upload emulator logcat
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FAMILY-COLONY-EMULATOR-LOGCAT
          path: ${{ runner.temp }}/family-colony-emulator-logcat.txt
          if-no-files-found: ignore
          retention-days: 7
