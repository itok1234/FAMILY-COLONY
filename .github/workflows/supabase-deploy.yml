name: Deploy Family Colony Supabase backend

concurrency:
  group: family-colony-supabase-deploy
  cancel-in-progress: false
# Deploy authentication backend and secure operational finance ledger.

on:
  push:
    paths:
      - 'supabase/migrations/**'
      - 'supabase/functions/**'
      - '.github/workflows/supabase-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check world session and direct world access functions
        run: deno check supabase/functions/fc-world-session/index.ts supabase/functions/fc-world-matchmaking/index.ts supabase/functions/_shared/world-session-policy_test.ts

      - name: Test world session role policy
        run: deno test supabase/functions/_shared/world-session-policy_test.ts

      - name: Apply member authentication schema
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: irwtnqekrwhgompulach
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "Missing Supabase access token"; exit 1; }
          python - <<'PY'
          import json
          from pathlib import Path
          sql = Path("supabase/migrations/202611220002_member_auth_activation.sql").read_text()
          Path("/tmp/fc-query.json").write_text(json.dumps({"query": sql}))
          PY
          code=$(curl -sS -w "%{http_code}" -o /tmp/fc-result.json -X POST \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/fc-query.json \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query")
          echo "Schema HTTP status: $code"
          if [[ "$code" != 2* ]]; then
            python - <<'PY'
          import json
          from pathlib import Path
          try:
            d=json.loads(Path("/tmp/fc-result.json").read_text())
            print(d.get("message") or d.get("error") or "Schema deployment failed")
          except Exception:
            print("Schema deployment failed; response omitted.")
          PY
            exit 1
          fi

      - name: Apply operational finance ledger schema
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: irwtnqekrwhgompulach
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          sql = Path("supabase/migrations/202611230001_operational_finance_ledger.sql").read_text()
          Path("/tmp/fc-finance-query.json").write_text(json.dumps({"query": sql}))
          PY
          code=$(curl -sS -w "%{http_code}" -o /tmp/fc-finance-result.json -X POST \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/fc-finance-query.json \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query")
          echo "Finance schema HTTP status: $code"
          if [[ "$code" != 2* ]]; then
            python - <<'PY'
          import json
          from pathlib import Path
          try:
            d=json.loads(Path("/tmp/fc-finance-result.json").read_text())
            print(d.get("message") or d.get("error") or "Finance schema deployment failed")
          except Exception:
            print("Finance schema deployment failed; response omitted.")
          PY
            exit 1
          fi

      - name: Apply secure Developer PIN schema
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: irwtnqekrwhgompulach
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          sql = Path("supabase/migrations/202611230002_developer_pin_login.sql").read_text()
          Path("/tmp/fc-pin-query.json").write_text(json.dumps({"query": sql}))
          PY
          code=$(curl -sS -w "%{http_code}" -o /tmp/fc-pin-result.json -X POST \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/fc-pin-query.json \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query")
          echo "Developer PIN schema HTTP status: $code"
          if [[ "$code" != 2* ]]; then
            python - <<'PY'
          import json
          from pathlib import Path
          try:
            d=json.loads(Path("/tmp/fc-pin-result.json").read_text())
            print(d.get("message") or d.get("error") or "Developer PIN schema deployment failed")
          except Exception:
            print("Developer PIN schema deployment failed; response omitted.")
          PY
            exit 1
          fi

      - name: Apply guest recommendation access schema
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: irwtnqekrwhgompulach
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          sql = Path("supabase/migrations/202611230003_guest_recommendation_access.sql").read_text()
          Path("/tmp/fc-guest-query.json").write_text(json.dumps({"query": sql}))
          PY
          code=$(curl -sS -w "%{http_code}" -o /tmp/fc-guest-result.json -X POST \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/fc-guest-query.json \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query")
          echo "Guest access schema HTTP status: $code"
          if [[ "$code" != 2* ]]; then
            cat /tmp/fc-guest-result.json
            exit 1
          fi

      - name: Apply Guest Premium applications schema
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: irwtnqekrwhgompulach
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          sql = Path("supabase/migrations/202611230004_guest_premium_applications.sql").read_text()
          Path("/tmp/fc-guest-premium-query.json").write_text(json.dumps({"query": sql}))
          PY
          code=$(curl -sS -w "%{http_code}" -o /tmp/fc-guest-premium-result.json -X POST \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/fc-guest-premium-query.json \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query")
          echo "Guest Premium schema HTTP status: $code"
          if [[ "$code" != 2* ]]; then
            cat /tmp/fc-guest-premium-result.json
            exit 1
          fi

      - name: Apply live announcement and maintenance schema
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: irwtnqekrwhgompulach
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          sql = Path("supabase/migrations/202611230005_app_control_maintenance.sql").read_text()
          Path("/tmp/fc-app-control-query.json").write_text(json.dumps({"query": sql}))
          PY
          code=$(curl -sS -w "%{http_code}" -o /tmp/fc-app-control-result.json -X POST \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/fc-app-control-query.json \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query")
          echo "App control schema HTTP status: $code"
          if [[ "$code" != 2* ]]; then
            cat /tmp/fc-app-control-result.json
            exit 1
          fi

      - name: Apply member registration requests schema
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: irwtnqekrwhgompulach
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          sql = Path("supabase/migrations/202611250002_member_registration_requests.sql").read_text()
          Path("/tmp/fc-registration-query.json").write_text(json.dumps({"query": sql}))
          PY
          code=$(curl -sS -w "%{http_code}" -o /tmp/fc-registration-result.json -X POST \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/fc-registration-query.json \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query")
          echo "Registration schema HTTP status: $code"
          if [[ "$code" != 2* ]]; then
            cat /tmp/fc-registration-result.json
            exit 1
          fi

      - name: Deploy member authentication Edge Function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: irwtnqekrwhgompulach
        run: |
          set -euo pipefail
          code=$(curl -sS -w "%{http_code}" -o /tmp/fc-function-result.json -X POST \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -F 'metadata={"name":"fc-member-auth","entrypoint_path":"index.ts","verify_jwt":false}' \
            -F 'file=@supabase/functions/fc-member-auth/index.ts;type=application/typescript' \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/functions/deploy?slug=fc-member-auth")
          echo "Edge Function deployment HTTP status: $code"
          if [[ "$code" != 2* ]]; then
            python - <<'PY'
          import json
          from pathlib import Path
          try:
            d=json.loads(Path("/tmp/fc-function-result.json").read_text())
            print(d.get("message") or d.get("error") or "Edge Function deployment rejected")
          except Exception:
            print("Edge Function deployment rejected; response omitted.")
          PY
            exit 1
          fi
          echo "Member authentication Edge Function deployed."

      - name: Apply world server registry schema
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: irwtnqekrwhgompulach
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          sql = Path("supabase/migrations/202611250001_cloud_world_ticketing.sql").read_text()
          Path("/tmp/fc-world-registry-query.json").write_text(json.dumps({"query": sql}))
          PY
          code=$(curl -sS -w "%{http_code}" -o /tmp/fc-world-registry-result.json -X POST \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/fc-world-registry-query.json \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query")
          echo "World server registry schema HTTP status: $code"
          if [[ "$code" != 2* ]]; then
            cat /tmp/fc-world-registry-result.json
            exit 1
          fi

      - name: Deploy cloud world matchmaking Edge Function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: irwtnqekrwhgompulach
        run: |
          set -euo pipefail
          npx --yes supabase@latest functions deploy fc-world-matchmaking --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt --yes
          echo "Direct world access endpoint deployed. Active members use their existing login session; no join ticket is required. A registered healthy game server is still required."

      - name: Deploy verified Godot world session Edge Function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: irwtnqekrwhgompulach
        run: |
          set -euo pipefail
          npx --yes supabase@latest functions deploy fc-world-session --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt --yes
          echo "Verified Godot world session Edge Function deployed with its shared policy module."
          
      - name: Deployment summary
        run: echo "Member activation backend deployed. No member passwords or service-role keys were exposed."
