name: Deploy Family Colony Supabase backend

on:
  push:
    paths:
      - 'supabase/migrations/**'
      - 'supabase/functions/**'
      - '.github/workflows/supabase-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply member authentication schema
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: irwtnqekrwhgompulach
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "Missing Supabase access token"; exit 1; }
          python - <<'PY'
          import json
          from pathlib import Path
          sql = Path("supabase/migrations/202611220002_member_auth_activation.sql").read_text()
          Path("/tmp/fc-query.json").write_text(json.dumps({"query": sql}))
          PY
          code=$(curl -sS -w "%{http_code}" -o /tmp/fc-result.json -X POST \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/fc-query.json \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query")
          echo "Schema HTTP status: $code"
          if [[ "$code" != 2* ]]; then
            python - <<'PY'
          import json
          from pathlib import Path
          try:
            d=json.loads(Path("/tmp/fc-result.json").read_text())
            print(d.get("message") or d.get("error") or "Schema deployment failed")
          except Exception:
            print("Schema deployment failed; response omitted.")
          PY
            exit 1
          fi

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy member authentication function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy fc-member-auth --project-ref irwtnqekrwhgompulach

      - name: Deployment summary
        run: echo "Member activation backend deployed. No member passwords or service-role keys were exposed."
