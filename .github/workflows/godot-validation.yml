name: Validate FAMILY COLONY 3D World
# Keep this workflow in sync with release validation gates.

on:
  push:
    branches:
      - feature/guest-premium-access
      - feature/direct-3d-entry
    paths:
      - "godot_world/**"
      - "app/src/main/assets/**"
      - "app/build.gradle"
      - "app/src/androidTest/**"
      - "build.gradle"
      - "settings.gradle"
      - "gradle.properties"
      - ".github/workflows/godot-validation.yml"
      - ".github/workflows/android-emulator-smoke.yml"
      - ".github/workflows/android-release.yml"
      - ".github/workflows/android-debug.yml"
  pull_request:
    paths:
      - "godot_world/**"
      - ".github/workflows/godot-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-godot:
    name: Godot project parse and startup smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout FAMILY COLONY
        uses: actions/checkout@v4

      - name: Generate and inspect bootstrap GLB pipeline assets
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check trimesh
          python godot_world/tools/generate_bootstrap_glb.py
          python - <<'PY'
          from pathlib import Path
          import trimesh
          paths = [
              Path("godot_world/assets/characters/bootstrap_character.glb"),
              Path("godot_world/assets/environment/bootstrap_environment.glb"),
          ]
          for path in paths:
              if not path.exists() or path.stat().st_size < 1024:
                  raise SystemExit(f"Missing or unexpectedly small GLB: {path}")
              scene = trimesh.load(path, force="scene")
              if not scene.geometry:
                  raise SystemExit(f"GLB contains no geometry: {path}")
              print(f"GLB pipeline check PASS: {path} ({len(scene.geometry)} mesh nodes)")
          PY
          echo "::notice::Bootstrap meshes are pipeline-test assets, not production visual approval."

      - name: Install Godot 4.4.1
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
          cache: true

      - name: Show engine version
        run: godot --version

      - name: Import and parse project resources
        shell: bash
        run: |
          set -euo pipefail
          log_file="$(mktemp)"
          godot --headless --editor --path godot_world --quit 2>&1 | tee "$log_file"
          if grep -E "SCRIPT ERROR:|Parse Error:|ERROR: Failed to load script" "$log_file"; then
            echo "::error::Godot reported script or resource errors during import."
            exit 1
          fi

      - name: Run Room and Lobby regression tests
        shell: bash
        run: |
          set -euo pipefail
          log_file="$(mktemp)"
          timeout 90s godot --headless --path godot_world --script res://tests/room_manager_test.gd 2>&1 | tee "$log_file"
          if ! grep -F "ROOM_MANAGER_TEST: PASS" "$log_file"; then
            echo "::error::Room manager regression tests did not pass."
            exit 1
          fi
          if grep -E "SCRIPT ERROR:|Parse Error:|ERROR: Failed to load script" "$log_file"; then
            echo "::error::Godot reported script or resource errors during Room and Lobby tests."
            exit 1
          fi

      - name: Run room chat input safety tests
        shell: bash
        run: |
          set -euo pipefail
          log_file="$(mktemp)"
          timeout 90s godot --headless --path godot_world --script res://tests/chat_manager_test.gd 2>&1 | tee "$log_file"
          if ! grep -F "CHAT_MANAGER_TEST: PASS" "$log_file"; then
            echo "::error::Chat manager regression tests did not pass."
            exit 1
          fi
          if grep -E "SCRIPT ERROR:|Parse Error:|ERROR: Failed to load script" "$log_file"; then
            echo "::error::Godot reported script or resource errors during chat tests."
            exit 1
          fi

      - name: Run room presence snapshot regression tests
        shell: bash
        run: |
          set -euo pipefail
          log_file="$(mktemp)"
          timeout 90s godot --headless --path godot_world --script res://tests/presence_manager_test.gd 2>&1 | tee "$log_file"
          if ! grep -F "PRESENCE_MANAGER_TEST: PASS" "$log_file"; then
            echo "::error::Presence manager regression tests did not pass."
            exit 1
          fi
          if grep -E "SCRIPT ERROR:|Parse Error:|ERROR: Failed to load script" "$log_file"; then
            echo "::error::Godot reported script or resource errors during presence tests."
            exit 1
          fi

      - name: Run 3D hub scene regression test
        shell: bash
        run: |
          set -euo pipefail
          log_file="$(mktemp)"
          timeout 90s godot --headless --path godot_world --script res://tests/hub_3d_test.gd 2>&1 | tee "$log_file"
          if ! grep -F "HUB_3D_TEST: PASS" "$log_file"; then
            echo "::error::3D hub scene regression tests did not pass."
            exit 1
          fi
          if grep -E "SCRIPT ERROR:|Parse Error:|ERROR: Failed to load script" "$log_file"; then
            echo "::error::Godot reported script or resource errors during hub tests."
            exit 1
          fi

      - name: Run procedural avatar regression test
        shell: bash
        run: |
          set -euo pipefail
          log_file="$(mktemp)"
          timeout 90s godot --headless --path godot_world --script res://tests/avatar_3d_test.gd 2>&1 | tee "$log_file"
          if ! grep -F "AVATAR_3D_TEST: PASS" "$log_file"; then
            echo "::error::Procedural avatar regression tests did not pass."
            exit 1
          fi
          if grep -E "SCRIPT ERROR:|Parse Error:|ERROR: Failed to load script" "$log_file"; then
            echo "::error::Godot reported script or resource errors during avatar tests."
            exit 1
          fi

      - name: Run production asset mount acceptance gate
        shell: bash
        run: |
          set -euo pipefail
          log_file="$(mktemp)"
          timeout 90s godot --headless --path godot_world --script res://tests/production_mount_test.gd 2>&1 | tee "$log_file"
          if ! grep -F "PRODUCTION_MOUNT_TEST: PASS" "$log_file"; then
            echo "::error::Production mount schema/fail-closed test did not pass."
            exit 1
          fi
          if grep -E "SCRIPT ERROR:|Parse Error:|ERROR: Failed to load script" "$log_file"; then
            echo "::error::Godot reported script/resource errors during production asset test."
            exit 1
          fi

      - name: Run world startup smoke test
        shell: bash
        run: |
          set -euo pipefail
          log_file="$(mktemp)"
          timeout 60s godot --headless --path godot_world --quit-after 5 2>&1 | tee "$log_file"
          if grep -E "SCRIPT ERROR:|Parse Error:|ERROR: Failed to load script" "$log_file"; then
            echo "::error::Godot reported script or resource errors during startup."
            exit 1
          fi

      - name: Render 3D world capture for visual QA review
        shell: bash
        run: |
          set -euo pipefail
          log_file="$(mktemp)"
          timeout 90s godot --headless --path godot_world --script res://tests/world_render_capture.gd 2>&1 | tee "$log_file"
          if ! grep -F "WORLD_RENDER_CAPTURE: PASS" "$log_file"; then
            echo "::error::World rendering capture failed."
            exit 1
          fi
          mkdir -p qa-output
          cp godot_world/qa-output/world_runtime_capture.png qa-output/world_runtime_capture.png
          if [ ! -s qa-output/world_runtime_capture.png ]; then
            echo "::error::Capture image was not found."
            exit 1
          fi

      - name: Upload rendered scene evidence (pending visual review)
        uses: actions/upload-artifact@v4
        with:
          name: FAMILY-COLONY-3D-WORLD-RENDER-QA
          path: qa-output/world_runtime_capture.png
          if-no-files-found: error
          retention-days: 14
