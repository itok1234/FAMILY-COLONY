name: Build FAMILY COLONY Signed Release APK

on:
  workflow_dispatch:
  push:
    branches:
      - feature/direct-3d-entry
    paths:
      - 'app/**'
      - 'godot_world/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/android-signed-release-branch.yml'

permissions:
  contents: read

jobs:
  signed-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Validate private release signing secrets
        shell: bash
        env:
          FC_KEYSTORE_BASE64: ${{ secrets.FC_KEYSTORE_BASE64 }}
          FC_KEYSTORE_PASSWORD: ${{ secrets.FC_KEYSTORE_PASSWORD }}
          FC_KEY_ALIAS: ${{ secrets.FC_KEY_ALIAS }}
          FC_KEY_PASSWORD: ${{ secrets.FC_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in FC_KEYSTORE_BASE64 FC_KEYSTORE_PASSWORD FC_KEY_ALIAS FC_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Required GitHub Actions secret $name is not configured."
              exit 1
            fi
          done
          printf '%s' "$FC_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/family-colony-release.jks"
          test -s "$RUNNER_TEMP/family-colony-release.jks"
          echo "FC_KEYSTORE_PATH=$RUNNER_TEMP/family-colony-release.jks" >> "$GITHUB_ENV"
          echo "FC_KEYSTORE_PASSWORD=$FC_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "FC_KEY_ALIAS=$FC_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "FC_KEY_PASSWORD=$FC_KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build signed Release APK
        run: gradle --no-daemon assembleRelease --stacktrace

      - name: Verify release APK signature, package and architectures
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          APKSIGNER="$(find "$SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          AAPT="$(find "$SDK_ROOT/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          "$APKSIGNER" verify --verbose "$APK"
          "$AAPT" dump badging "$APK" | grep -E "^package:|^sdkVersion:|^targetSdkVersion:"
          unzip -Z1 "$APK" | grep -q '^lib/arm64-v8a/'
          unzip -Z1 "$APK" | grep -q '^lib/armeabi-v7a/'
          sha256sum "$APK"

      - name: Upload signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: FAMILY-COLONY-5.0-SIGNED-RELEASE
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
