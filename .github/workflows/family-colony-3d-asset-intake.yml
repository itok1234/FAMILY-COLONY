name: FAMILY COLONY 3D Asset Intake (Unapproved Candidates)

on:
  workflow_dispatch:
  push:
    branches:
      - feature/direct-3d-entry
    paths:
      - "godot_world/assets/asset_sources.json"
      - "godot_world/tools/fetch_production_assets.py"
      - ".github/workflows/family-colony-3d-asset-intake.yml"

permissions:
  contents: read

jobs:
  intake:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout locked 3D work branch
        uses: actions/checkout@v4
        with:
          ref: feature/direct-3d-entry

      - name: Download source-listed GLB candidates
        run: python3 godot_world/tools/fetch_production_assets.py

      - name: Structural inspection (not visual acceptance)
        run: python3 godot_world/tools/inspect_downloaded_glbs.py

      - name: Install Godot for real GLB import validation
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
          cache: true

      - name: Import candidate GLBs in Godot headless
        shell: bash
        run: |
          set -euo pipefail
          log_file="$(mktemp)"
          godot --headless --editor --path godot_world --quit 2>&1 | tee "$log_file"
          if grep -E "SCRIPT ERROR:|Parse Error:|ERROR: Failed to load script|ERROR: Cannot load" "$log_file"; then
            echo "::error::Godot reported import or resource errors."
            exit 1
          fi
          echo "::notice::Successful headless import proves resource parsing only, not visual QA or device performance."

      - name: Runtime scene smoke check (headless; not visual/device QA)
        shell: bash
        run: |
          set -euo pipefail
          log_file="$(mktemp)"
          timeout 90 godot --headless --path godot_world --scene res://scenes/world.tscn --quit 2>&1 | tee "$log_file"
          if grep -E "SCRIPT ERROR:|Parse Error:|ERROR: Failed to load script|ERROR: Cannot load|Node not found" "$log_file"; then
            echo "::error::Runtime scene reported script/resource/node errors."
            exit 1
          fi
          echo "::notice::Headless scene startup smoke check only; does not confirm rendered visuals or device performance."

      - name: Package candidate assets and receipt for review
        run: |
          set -euo pipefail
          mkdir -p godot_world/intake-output
          cp godot_world/assets/asset_download_receipt.json godot_world/intake-output/
          find godot_world/assets/characters godot_world/assets/environment -type f -name '*.glb' -exec cp {} godot_world/intake-output/ \;
          zip -r godot_world/FAMILY-COLONY-3D-INTAKE-CANDIDATES.zip godot_world/intake-output

      - name: Upload candidate package (pending visual QA)
        uses: actions/upload-artifact@v4
        with:
          name: FAMILY-COLONY-3D-INTAKE-CANDIDATES
          path: godot_world/FAMILY-COLONY-3D-INTAKE-CANDIDATES.zip
          if-no-files-found: error
          retention-days: 14
