name: Supabase Security Audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Test read-only database access
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          http_code=$(curl -sS -w "%{http_code}" -o query-test.json -X POST \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"query":"select 1 as connection_ok","parameters":[]}' \
            "https://api.supabase.com/v1/projects/irwtnqekrwhgompulach/database/query/read-only")
          echo "Read-only connection HTTP: $http_code"
          cat query-test.json
          case "$http_code" in
            2*) ;;
            *) echo "Database read access is not available. See the response above."; exit 1 ;;
          esac

      - name: Inspect tables and RLS (read only)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          cat > request.json <<'JSON'
          {
            "query": "select json_build_object('tables', coalesce((select json_agg(json_build_object('schema', table_schema, 'name', table_name) order by table_schema, table_name) from information_schema.tables where table_schema = 'public' and table_type = 'BASE TABLE'), '[]'::json), 'policies', coalesce((select json_agg(json_build_object('table', tablename, 'policy', policyname, 'command', cmd, 'roles', roles) order by tablename, policyname) from pg_catalog.pg_policies where schemaname = 'public'), '[]'::json)) as database_audit;",
            "parameters": []
          }
          JSON
          http_code=$(curl -sS -w "%{http_code}" -o database-audit.json -X POST \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary @request.json \
            "https://api.supabase.com/v1/projects/irwtnqekrwhgompulach/database/query/read-only")
          echo "Database metadata HTTP: $http_code"
          cat database-audit.json
          case "$http_code" in
            2*) ;;
            *) echo "Metadata inspection failed. The response above contains the reason."; exit 1 ;;
          esac
