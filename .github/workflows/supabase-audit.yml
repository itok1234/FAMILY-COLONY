
name: Supabase Security Audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check Supabase API Keys
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "Token belum tersedia."
            exit 1
          fi

          curl -fsS \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Accept: application/json" \
            "https://api.supabase.com/v1/projects/irwtnqekrwhgompulach/api-keys" \
            -o keys.json

          echo "Daftar API Key (tanpa nilai rahasia):"
          jq '[.[] | {id, name, type}]' keys.json
