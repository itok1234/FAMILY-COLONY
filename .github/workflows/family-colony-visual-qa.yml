name: FAMILY COLONY 3DSV Technical Gates
on:
  workflow_dispatch:
  push:
    branches: [feature/direct-3d-entry]
    paths:
      - "godot_world/scenes/**"
      - "godot_world/scripts/**"
      - "godot_world/tests/3dsv_test.gd"
      - ".github/workflows/family-colony-visual-qa.yml"
permissions:
  contents: read
jobs:
  technical-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.4.1
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
          cache: true
      - name: Import project
        run: godot --headless --editor --path godot_world --quit
      - name: Run five independent 3DSV technical gates
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path godot_world --script res://tests/3dsv_test.gd 2>&1 | tee 3dsv.log
          grep -F "3DSV_ALL_PASS" 3dsv.log
      - name: Upload gate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: family-colony-3dsv-report
          path: 3dsv.log
          if-no-files-found: warn
