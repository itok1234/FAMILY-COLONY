name: FAMILY COLONY Rendered Visual QA Capture
on:
  workflow_dispatch:
  push:
    branches: [feature/direct-3d-entry]
    paths:
      - "godot_world/scenes/**"
      - "godot_world/scripts/**"
      - "godot_world/tests/visual_capture_test.gd"
      - ".github/workflows/family-colony-visual-qa.yml"
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
          cache: true
      - name: Install display and software renderer
        run: sudo apt-get update && sudo apt-get install -y xvfb mesa-utils
      - name: Import project
        run: godot --headless --editor --path godot_world --quit
      - name: Render world and capture screenshot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p visual-qa-output
          xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1 godot --path godot_world --script res://tests/visual_capture_test.gd 2>&1 | tee capture.log
          grep -F "VISUAL_CAPTURE: PASS" capture.log
          find godot_world/.godot -maxdepth 3 -type f >/dev/null || true
          CAPTURE="$(find ~/.local/share/godot/app_userdata -path '*/visual_qa/world_capture.png' -type f | head -n 1)"
          if [ -z "$CAPTURE" ]; then echo "Screenshot file not found"; exit 1; fi
          cp "$CAPTURE" visual-qa-output/world_capture.png
          cp capture.log visual-qa-output/capture.log
      - name: Preserve screenshot and capture diagnostics even on failure
        if: always()
        shell: bash
        run: |
          mkdir -p visual-qa-output
          cp capture.log visual-qa-output/capture.log 2>/dev/null || true
          CAPTURE="$(find ~/.local/share/godot/app_userdata -path '*/visual_qa/world_capture.png' -type f | head -n 1)"
          if [ -n "$CAPTURE" ]; then cp "$CAPTURE" visual-qa-output/world_capture.png; fi
      - name: Upload capture diagnostics even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: family-colony-capture-diagnostics
          path: visual-qa-output/
          if-no-files-found: warn

      - name: Upload rendered evidence
        uses: actions/upload-artifact@v4
        with:
          name: family-colony-rendered-visual-qa
          path: visual-qa-output/
          if-no-files-found: error
